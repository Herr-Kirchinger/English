<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Numbers 1–10 Game</title></head><body><title>Numbers 1–10 Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen tablet game — header strip, prompt card, 2×2 picture choices; single light "classroom paper" look on purpose */
:root{
  color-scheme: light;
  --paper:#F6F1FC;      /* lilac exercise-book paper */
  --dot:#E4D8F3;        /* paper dots */
  --card:#FFFFFF;
  --ink:#2B2140;
  --muted:#7A6A93;
  --lila:#6A1B9A;       /* English subject colour */
  --lila2:#8E24AA;
  --soft:#EDE7F6;
  --ok:#2E9E5B;  --okSoft:#DDF3E6;
  --no:#D9534F;  --noSoft:#FBE3E2;
  --star:#F5B700;
  --display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --read:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--display);overflow:hidden;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);
  padding-block:clamp(8px,1.6vh,18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;flex:none}
.e{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--lila),var(--lila2));color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:26px;box-shadow:0 4px 0 #4c1270;flex:none}
header h1{margin:0;font-size:clamp(20px,3.2vh,30px);font-weight:600;color:var(--lila);line-height:1.1;text-wrap:balance}
header .sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sp{margin-left:auto}
@media (max-width:640px){header .sub{display:none}header h1{white-space:nowrap}}
.iconbtn{font:inherit;border:none;background:var(--card);color:var(--lila);border-radius:14px;padding:10px 14px;display:inline-flex;align-items:center;gap:8px;
  font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--dot)}
.iconbtn svg{width:22px;height:22px}
button:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,2vh,20px)}
.view[hidden]{display:none!important}
/* Home */
.hero{flex:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:1vh}
.hero .big{font-size:clamp(34px,7vh,64px);font-weight:700;color:var(--lila);line-height:1;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:clamp(15px,2.2vh,20px)}
.strip{display:flex;justify-content:center;gap:clamp(4px,1vw,10px);flex-wrap:wrap}
.strip img{height:clamp(40px,8vh,78px);width:auto;filter:drop-shadow(0 3px 0 rgba(106,27,154,.12))}
.modes{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,22px);align-content:center;max-width:980px;width:100%;margin:0 auto}
.mode{font:inherit;border:none;cursor:pointer;background:var(--card);border-radius:26px;padding:clamp(14px,3vh,28px) 12px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 6px 0 var(--dot);color:var(--ink);transition:transform .12s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--dot)}
.mode .ic{width:clamp(64px,12vh,110px);height:clamp(64px,12vh,110px);border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--lila)}
.mode .ic svg{width:55%;height:55%}
.mode b{font-size:clamp(20px,3.4vh,30px);font-weight:600;color:var(--lila)}
.mode span{font-size:clamp(13px,1.9vh,17px);color:var(--muted)}
.mode>div:last-child{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mode.main .ic{background:linear-gradient(135deg,var(--lila),var(--lila2));color:#fff}
/* Learn grid */
.lgrid{flex:1;min-height:0;display:grid;gap:clamp(8px,1.4vw,14px);grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.lcard{font:inherit;border:none;cursor:pointer;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--dot);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;min-height:0}
.lcard img{flex:1;min-height:0;max-height:100%;max-width:100%;object-fit:contain}
.lcard .w{font-family:var(--read);font-size:clamp(16px,2.6vh,26px);font-weight:700;color:var(--lila);min-height:1.3em}
.lcard.on{background:var(--soft)}
/* Play */
.play{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:clamp(10px,2vh,20px)}
.prompt{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.speak{font:inherit;border:none;cursor:pointer;width:clamp(76px,13vh,120px);height:clamp(76px,13vh,120px);border-radius:50%;
  background:linear-gradient(135deg,var(--lila),var(--lila2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #4c1270}
.speak svg{width:52%;height:52%}
.speak.pulse{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.08)}}
.wordcard{background:var(--card);border-radius:22px;box-shadow:0 6px 0 var(--dot);padding:.25em .9em;font-family:var(--read);font-weight:700;
  font-size:clamp(40px,9vh,86px);color:var(--lila);line-height:1.15}
.hint{color:var(--muted);font-size:clamp(14px,2vh,18px)}
.opts{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,2vw,20px);max-width:900px;width:100%;margin:0 auto}
.opt{font:inherit;border:4px solid transparent;cursor:pointer;background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--dot);padding:clamp(6px,1.4vh,14px);
  display:flex;align-items:center;justify-content:center;min-height:0;position:relative;transition:transform .12s}
.opt img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.opt:active{transform:translateY(3px)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--no);background:var(--noSoft);opacity:.55;animation:shake .35s}
.opt .tag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--read);font-weight:700;color:var(--ok);font-size:clamp(16px,2.6vh,26px);background:#fff;border-radius:12px;padding:0 .5em}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.bar i{width:clamp(16px,2.6vh,26px);height:clamp(16px,2.6vh,26px);display:block}
.bar i svg{width:100%;height:100%}
.msg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;visibility:hidden;pointer-events:none;font-size:clamp(34px,7vh,72px);font-weight:700;color:var(--ok);
  background:#fff;border:4px solid currentColor;border-radius:999px;padding:.12em .7em;box-shadow:0 10px 30px rgba(74,20,140,.25);transition:all .25s;z-index:50}
.msg.show{visibility:visible}
.msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.msg.no{color:var(--no)}
/* Finish */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,24px);text-align:center}
.done h2{margin:0;font-size:clamp(44px,10vh,96px);color:var(--lila);font-weight:700;line-height:1}
.done .score{font-size:clamp(22px,4vh,40px);font-weight:600}
.done .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.done .row .iconbtn{font-size:20px;padding:14px 22px}
.note{font-size:13px;color:var(--muted);text-align:center;flex:none}
@media (max-width:640px){.modes{grid-template-columns:minmax(0,1fr)}.mode{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px 16px}.mode .ic{width:56px;height:56px;flex:none}
  .mode>div:last-child{align-items:flex-start;text-align:left}.strip img{height:38px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</svg>

<div class="app">
  <header>
    <div class="e" aria-hidden="true">E</div>
    <div><h1>Numbers</h1><div class="sub">English time · Class 3</div></div>
    <span class="sp"></span>
    <button class="iconbtn" id="homeBtn" hidden><svg><use href="#i-home"/></svg>Home</button>
  </header>

  <section class="view" id="vHome">
    <div class="hero">
      <div class="big">one, two, three …</div>
      <p>Choose a game.</p>
      <div class="strip" id="strip"></div>
    </div>
    <div class="modes">
      <button class="mode" id="mLook"><div class="ic"><svg><use href="#i-look"/></svg></div><div><b>Look &amp; listen</b><span>Tap a picture. Listen and read.</span></div></button>
      <button class="mode main" id="mListen"><div class="ic"><svg><use href="#i-speak"/></svg></div><div><b>Listen &amp; tap</b><span>Listen. Tap the right picture.</span></div></button>
      <button class="mode" id="mRead"><div class="ic"><svg><use href="#i-read"/></svg></div><div><b>Read &amp; tap</b><span>Read the word. Tap the picture.</span></div></button>
    </div>
    <p class="note" id="soundNote">Turn the sound on.</p>
  </section>

  <section class="view" id="vLook" hidden>
    <div class="lgrid" id="lgrid"></div>
  </section>

  <section class="view" id="vPlay" hidden>
    <div class="play">
      <div class="prompt" id="prompt"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="bar" id="bar" aria-label="Progress"></div>
  </section>

  <section class="view" id="vDone" hidden>
    <div class="done">
      <h2>Well done!</h2>
      <div class="strip" id="doneStars"></div>
      <div class="score" id="score"></div>
      <div class="row">
        <button class="iconbtn" id="againBtn"><svg><use href="#i-again"/></svg>Play again</button>
        <button class="iconbtn" id="home2Btn"><svg><use href="#i-home"/></svg>Home</button>
      </div>
    </div>
  </section>
</div>
<div class="msg" id="msg"></div>

var hasSpeech=true, BUF={}, prepped=false, curSrc=null, curEl=null;
function actx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended"){try{AC.resume()}catch(e){}}return AC;}
function b64buf(d){var s=atob(d.split(",")[1]);var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function prep(){if(prepped)return;prepped=true;var c;try{c=actx();}catch(e){return;}
  Object.keys(AUDIO).forEach(function(w){try{var p=c.decodeAudioData(b64buf(AUDIO[w]),function(b){BUF[w]=b;},function(){});if(p&&p.catch)p.catch(function(){});}catch(e){}});}
document.addEventListener("pointerdown",prep,{passive:true});document.addEventListener("touchend",prep,{passive:true});document.addEventListener("click",prep,{passive:true});
function hush(){if(curSrc){try{curSrc.stop()}catch(e){}curSrc=null;}if(curEl){try{curEl.pause()}catch(e){}curEl=null;}}
function say(w){hush();if(!AUDIO[w])return;
  try{var c=actx();if(BUF[w]){var s=c.createBufferSource();s.buffer=BUF[w];s.connect(c.destination);s.start(0);curSrc=s;return;}}catch(e){}
  try{var a=new Audio(AUDIO[w]);curEl=a;var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}

/* --- little sounds --- */
var AC=null;
function tone(f,d,when,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
  var t=AC.currentTime+(when||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
function yay(){tone(660,.18,0);tone(880,.18,.12);tone(1320,.3,.24);}
function nope(){tone(220,.25,0,"triangle");}

function flash(t,bad){var m=$("msg");m.textContent=t;m.className="msg show"+(bad?" no":"");clearTimeout(flash.t);flash.t=setTimeout(function(){m.className="msg"+(bad?" no":"")},700);}
function starSVG(c){return '<svg viewBox="0 0 24 24"><use href="#i-star" fill="'+c+'"/></svg>';}

/* --- home strip --- */
(function(){var h="";shuffle(ITEMS).slice(0,Math.min(7,ITEMS.length)).forEach(function(it){h+='<img src="'+it.img+'" alt="">';});$("strip").innerHTML=h;})();

/* --- Look & listen --- */
function openLook(){var g=$("lgrid");var n=ITEMS.length;var cols=n<=10?5:(n<=12?4:7);if(window.innerWidth<640)cols=n<=10?2:3;g.style.setProperty("--cols",cols);
  var h="";ITEMS.forEach(function(it,i){h+='<button class="lcard" data-i="'+i+'"><img src="'+it.img+'" alt="'+it.w+'"><span class="w"></span></button>';});g.innerHTML=h;
  Array.prototype.forEach.call(g.children,function(b){b.onclick=function(){var it=ITEMS[+b.dataset.i];b.classList.add("on");b.querySelector(".w").textContent=it.w;say(it.w);};});
  show("vLook");}

/* --- Rounds --- */
var mode="listen",queue=[],qi=0,target=null,first=true,results=[],locked=false;
function start(m){mode=m;queue=shuffle(ITEMS).slice(0,Math.min(ROUND,ITEMS.length));qi=0;results=[];show("vPlay");next();}
function drawBar(){var h="";for(var i=0;i<queue.length;i++){var c=i<results.length?(results[i]?"var(--star)":"#C9B3E6"):"#E4D8F3";h+="<i>"+starSVG(c)+"</i>";}$("bar").innerHTML=h;}
function next(){if(qi>=queue.length)return finish();target=queue[qi];first=true;locked=false;
  var opts=shuffle([target].concat(shuffle(ITEMS.filter(function(x){return x!==target})).slice(0,3)));
  var p=$("prompt");
  if(mode==="listen"){p.innerHTML='<button class="speak" id="spk" aria-label="Listen again"><svg><use href="#i-speak"/></svg></button><span class="hint">Listen and tap.</span>';
    $("spk").onclick=function(){say(target.w)};setTimeout(function(){say(target.w)},250);}
  else{p.innerHTML='<div class="wordcard">'+target.w+'</div><span class="hint">Read and tap.</span>';}
  var o=$("opts");o.innerHTML="";opts.forEach(function(it){var b=document.createElement("button");b.className="opt";b.innerHTML='<img src="'+it.img+'" alt="">';
    b.onclick=function(){pick(b,it)};o.appendChild(b);});
  drawBar();}
function pick(b,it){if(locked||b.classList.contains("wrong"))return;
  if(it===target){locked=true;b.classList.add("right");b.insertAdjacentHTML("beforeend",'<span class="tag">'+it.w+'</span>');results.push(first);yay();flash(first?"Great!":"Yes!");
    setTimeout(function(){say(it.w)},350);setTimeout(function(){qi++;next();},1600);}
  else{first=false;b.classList.add("wrong");nope();flash("Try again!",true);if(mode==="listen"){var s=$("spk");if(s){s.classList.remove("pulse");void s.offsetWidth;s.classList.add("pulse");}setTimeout(function(){say(target.w)},500);}}
}
function finish(){var n=results.filter(Boolean).length;var h="";for(var i=0;i<results.length;i++)h+='<i style="width:clamp(26px,5vh,48px);height:clamp(26px,5vh,48px);display:block">'+starSVG(results[i]?"var(--star)":"#C9B3E6")+"</i>";
  $("doneStars").innerHTML=h;$("score").textContent=n+" / "+results.length+" stars";show("vDone");yay();}

$("mLook").onclick=openLook;
$("mListen").onclick=function(){start("listen")};
$("mRead").onclick=function(){start("read")};
$("againBtn").onclick=function(){start(mode)};
$("homeBtn").onclick=$("home2Btn").onclick=function(){hush();show("vHome")};
show("vHome");
</script>
