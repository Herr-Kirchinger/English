*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Pop',system-ui,sans-serif;color:#243b53;background:linear-gradient(180deg,#E3F1DD 0%,#F4F9EE 40%,#FFFDF6 100%);background-attachment:fixed}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:34px;font-weight:800;color:#2E5E2A;line-height:1.1}
.card{background:#fff;border-radius:26px;box-shadow:0 8px 26px rgba(46,94,42,.14);padding:22px}
.btn{border:none;font:inherit;font-weight:800;font-size:19px;border-radius:18px;padding:13px 22px;cursor:pointer;background:#2E7D32;color:#fff;box-shadow:0 5px 0 #1b4f1e;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b4f1e}
.btn.sec{background:#EEF3F8;color:#35506b;box-shadow:0 5px 0 #c9d6e3}
.btn.tip{background:#FFC93C;color:#5a3b00;box-shadow:0 5px 0 #d9a21a}
.btn.big{font-size:23px;padding:16px 30px}
.owl{display:flex;gap:14px;align-items:flex-start;margin:12px 0}
.owl .o{font-size:52px;line-height:1;flex:none;cursor:pointer;user-select:none}
.bub{background:#FFF8E1;border:3px solid #F4C95D;border-radius:22px;padding:14px 18px;font-size:18px;line-height:1.45;position:relative;flex:1}
.bub:before{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right-color:#F4C95D;border-width:9px 13px 9px 0}
.bub b{color:#9a6b00}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.role{background:#E8F5E9;color:#2E5E2A;border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px}
.role.w{background:#E3F2FD;color:#1565C0}
.sthead{display:flex;align-items:center;gap:16px}
.sthead img{height:96px;width:auto;flex:none}
.sthead .k{font-size:15px;font-weight:800;color:#6b8f62;letter-spacing:.06em}
.sthead h2{font-size:30px;font-weight:800;color:#2E5E2A;line-height:1.1}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.fb{margin-top:14px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:600;display:none;line-height:1.4}
.fb.bad{display:block;background:#FDECEA;color:#B23A2E;border:2px solid #F5B7B1}
.fb.ok{display:block;background:#E8F5E9;color:#2E7D32;border:2px solid #A5D6A7}
.fb.sol{display:block;background:#F1F3F6;color:#6b7c8f;border:2px dashed #c3ccd8;font-size:15px}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:19px;margin:12px 0;font-weight:600}
.q .n{background:#2E7D32;color:#fff;border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
input.num{font:inherit;font-weight:800;font-size:24px;width:96px;text-align:center;padding:6px 8px;border:3px solid #c3d4c0;border-radius:14px;background:#FBFDF9;color:#1B4F1E}
input.num:focus{outline:none;border-color:#43A047;background:#fff}
input.num.s{width:76px}
input.name{font:inherit;font-size:22px;font-weight:700;padding:10px 14px;border:3px solid #c3d4c0;border-radius:14px;width:100%}
.map svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.pulse{animation:pl 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.08)}}
.ov{position:fixed;inset:0;background:rgba(30,50,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov .card{max-width:560px;text-align:center}
.zz{font-size:110px;font-weight:800;color:#C98F00;line-height:1;margin:8px 0;text-shadow:0 5px 0 #F4E3A8}
.planks{display:flex;flex-direction:column;gap:7px;padding:10px 26px;position:relative;background:linear-gradient(90deg,transparent 0,transparent 12px,#8D6E4E 12px,#8D6E4E 17px,transparent 17px,transparent calc(100% - 17px),#8D6E4E calc(100% - 17px),#8D6E4E calc(100% - 12px),transparent calc(100% - 12px))}
.plank{border:none;font:inherit;font-size:20px;font-weight:700;padding:11px 16px;border-radius:9px;cursor:pointer;color:#4a2f14;text-align:center;
  background:repeating-linear-gradient(90deg,#D9A86C 0,#D9A86C 40px,#CF9D60 40px,#CF9D60 42px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);position:relative}
.plank.on{outline:4px solid #43A047;background:repeating-linear-gradient(90deg,#E6C08A 0,#E6C08A 40px,#DDB47E 40px,#DDB47E 42px)}
.plank.on:after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#43A047;color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;font-size:17px}
.stones{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:10px}
.stone{border:none;font:inherit;width:160px;height:108px;border-radius:48% 52% 45% 55%/55% 48% 52% 45%;cursor:pointer;
  background:radial-gradient(ellipse at 35% 30%,#E8E4DC 0,#C9C2B5 45%,#A79F91 100%);box-shadow:inset -6px -8px 0 rgba(0,0,0,.08),0 6px 0 #8f877a;font-size:21px;font-weight:800;color:#3b352c;position:relative}
.stone:nth-child(2n){border-radius:55% 45% 52% 48%/48% 55% 45% 52%}
.stone.on{opacity:.55;transform:scale(.94)}
.stone .ord{position:absolute;top:-10px;left:-6px;background:#2E7D32;color:#fff;border-radius:50%;width:36px;height:36px;line-height:36px;font-size:19px;box-shadow:0 3px 0 #1b4f1e}
.abc{display:inline-flex;gap:8px}
.abc button{border:3px solid #c3d4c0;background:#FBFDF9;font:inherit;font-weight:800;font-size:22px;border-radius:14px;width:58px;height:50px;cursor:pointer;color:#35506b}
.abc button.on{background:#2E7D32;color:#fff;border-color:#2E7D32}
.small{font-size:15px;color:#6b8299}
.cert{border:6px double #C98F00;border-radius:22px;padding:26px;background:linear-gradient(180deg,#FFFCF1,#FFF6D8)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.sthead img{height:70px}.sthead h2{font-size:24px}h1{font-size:27px}}
</style></head><body>

const KEY='zauberwald-v1';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const num=v=>{v=String(v).trim().replace(',','.');return v===''?NaN:Number(v);};
const mcm=c=>{const m=Math.floor(c/100),r=c%100;return m?(m+' m'+(r?' '+r+' cm':'')):(r+' cm');};
let G=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}

/* ---------- Rätsel-Daten erzeugen ---------- */
function genP1(){ let L; do{L=[rnd(32,92),rnd(32,92),rnd(32,92)];}while(Math.abs(L[0]-L[1])<7||Math.abs(L[0]-L[2])<7||Math.abs(L[1]-L[2])<7||L.every(x=>x%10===0));
  return {L,x0:[rnd(40,170),rnd(40,170),rnd(40,170)]}; }
const TRUE=[['1 m = 100 cm'],['1 cm = 10 mm'],['1 km = 1000 m'],['3 m 5 cm = 305 cm'],['4 cm 7 mm = 47 mm'],['2 m 50 cm = 250 cm'],['80 mm = 8 cm'],['1 km 200 m = 1200 m'],['½ m = 50 cm'],['102 cm = 1 m 2 cm'],['2 km 50 m = 2050 m'],['1 m = 1000 mm'],['½ km = 500 m']];
const FALSE=[['3 m 5 cm = 350 cm','3 m 5 cm sind 300 cm + 5 cm = 305 cm.'],['1 km = 100 m','1 km sind 1000 m.'],['45 mm = 45 cm','45 mm sind nur 4 cm 5 mm.'],['2 m = 20 cm','2 m sind 200 cm.'],['1 m 8 cm = 180 cm','1 m 8 cm sind 100 cm + 8 cm = 108 cm.'],['60 mm = 60 cm','60 mm sind 6 cm.'],['½ cm = 50 mm','½ cm sind 5 mm.'],['7 km = 700 m','7 km sind 7000 m.'],['250 cm = 25 m','250 cm sind 2 m 50 cm.'],['1 m 50 cm = 1050 cm','1 m 50 cm sind 150 cm.']];
function genP2(){ const t=shuffle(TRUE).slice(0,5).map(x=>({s:x[0],ok:true})), f=shuffle(FALSE).slice(0,4).map(x=>({s:x[0],ok:false,e:x[1]}));
  return {planks:shuffle(t.concat(f))}; }
function genP3(){ let J; do{J=[0,0,0,0].map(()=>rnd(13,28)*5);}while(J.filter(x=>x>=100).length<2||J.reduce((a,b)=>a+b)<330||J.reduce((a,b)=>a+b)>560||J.reduce((a,b)=>a+b)%100===0);
  return {J,sum:J.reduce((a,b)=>a+b)}; }
function genP4(){ let V; do{V=shuffle([...Array(49)].map((_,i)=>150+i*5)).slice(0,6);}while(V.some((a,i)=>V.some((b,j)=>i!==j&&Math.abs(a-b)<6)));
  const fm=shuffle(['mcm','cm','mm','mcm','mm','cm']);
  const lab=V.map((c,i)=>{const f=fm[i]; if(f==='mm')return (c*10)+' mm'; if(f==='cm')return c+' cm'; return c%100? (Math.floor(c/100)+' m '+(c%100)+' cm') : (c/100+' m');});
  return {V,lab}; }
function genP5(){ const H=[4,5,6,8][rnd(0,3)], S=[25,50][rnd(0,1)], N=rnd(5,7); return {H,S,N,h:H*100/S,c:N*S}; }
function genP6(){ let R,T; do{ R=[[rnd(12,45)*10,rnd(12,45)*10,rnd(12,45)*10],[rnd(30,69)*10,rnd(30,69)*10],[rnd(12,45)*10,rnd(12,45)*10,rnd(12,45)*10]];
   T=R.map(r=>r.reduce((a,b)=>a+b)); }while(T.some(t=>t<760||t>1460)||Math.abs(T[0]-T[1])<40||Math.abs(T[0]-T[2])<40||Math.abs(T[1]-T[2])<40);
  const mn=Math.min(...T), mx=Math.max(...T); return {R,T,best:'ABC'[T.indexOf(mn)],mn,diff:mx-mn}; }
function newGame(a,b){ G={names:[a,b],st:0,done:[false,false,false,false,false,false],zz:[0,0,0,0,0,0].map(()=>rnd(1,9)),t0:Date.now(),tips:0,
  p:[genP1(),genP2(),genP3(),genP4(),genP5(),genP6()],won:false}; save(); }

/* ---------- Stationen ---------- */
const ST=[
 {k:'STATION 1',t:'Der verzauberte Wegweiser',img:'lw-start',
  story:()=>`Am Wegweiser zeigen drei Wege in den Wald. Doch der Waldgeist hat die Schilder weggezaubert! Nur wer <b>alle drei Wege genau misst</b>, findet den richtigen Pfad.<br>Schiebt das Lineal unter jeden Weg und messt in <b>Millimetern</b>.`,
  tips:['Legt die <b>0</b> des Lineals genau an den linken Endstrich des Weges – nicht den Rand des Lineals!','Lest zuerst die ganzen Zentimeter ab und zählt dann die kleinen Millimeter-Striche dazu. 5 cm und 3 mm sind 53 mm.','Denkt daran: 1 cm = 10 mm. Ein Weg mit 6 cm 4 mm ist 64 mm lang.'],
  sol:p=>`A = ${p.L[0]} mm, B = ${p.L[1]} mm, C = ${p.L[2]} mm`},
 {k:'STATION 2',t:'Die wackelige Brücke',img:'lw-bruecke',
  story:()=>`Über den Zauberbach führt eine Brücke mit 9 Brettern. Der Waldgeist hat einige Bretter <b>morsch</b> gezaubert – auf ihnen steht etwas <b>Falsches</b>!<br>Tippt alle <b>stabilen</b> Bretter an (dort stimmt es). Dann wagt ihr euch über die Brücke.`,
  tips:['Merkt euch: 1 cm = 10 mm · 1 m = 100 cm · 1 km = 1000 m.','Rechnet gemischte Angaben Schritt für Schritt um: 3 m 5 cm = 300 cm + 5 cm = 305 cm.','Es sind genau 5 stabile Bretter.'],
  sol:p=>'Stabil: '+p.planks.filter(x=>x.ok).map(x=>x.s).join(' · ')},
 {k:'STATION 3',t:'Fridolin am Teich',img:'lw-teich',
  story:p=>`Frosch Fridolin will euch über den Teich helfen. Er springt von Seerose zu Seerose. Die Sprünge sind so lang: <b>${p.J.map(mcm).join(' · ')}</b>.`,
  tips:['Rechnet zuerst alle Sprünge in cm um: 1 m 20 cm = 120 cm.','Addiert alle cm. 100 cm sind 1 m – aus 455 cm werden 4 m 55 cm.','6 m sind 600 cm. Rechnet 600 cm minus Fridolins ganze Strecke.'],
  sol:p=>`a) ${Math.floor(p.sum/100)} m ${p.sum%100} cm · b) ${600-p.sum} cm`},
 {k:'STATION 4',t:'Der Zauberstein-Haufen',img:'lw-steine',
  story:()=>`Ein Steinhaufen versperrt den Weg! Auf jedem Zauberstein steht eine Länge. Der Haufen lässt sich nur abtragen, wenn ihr die Steine <b>von der kürzesten zur längsten Länge</b> antippt.`,
  tips:['Rechnet jede Länge in cm um: 2 m 8 cm = 208 cm.','Bei mm-Angaben: 10 mm = 1 cm. Aus 2340 mm werden 234 cm.','Schreibt alle cm-Werte auf euren Zettel und ordnet sie dann.'],
  sol:p=>'Reihenfolge: '+p.V.map((v,i)=>[v,p.lab[i]]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' → ')},
 {k:'STATION 5',t:'Der Riesenbaum',img:'lw-baum-1',
  story:p=>`Ganz oben im Riesenbaum wohne ich, Eule Ella. Der Baum ist <b>${p.H} m</b> hoch. Schnecke Susi bringt mir einen Brief. Sie kriecht jede Stunde <b>${p.S} cm</b> weit nach oben.`,
  tips:[p=>`Rechnet die Höhe in cm um: ${p.H} m = ${p.H*100} cm.`,p=>`Wie oft passen ${p.S} cm in 100 cm? So viele Stunden braucht Susi für 1 Meter.`,p=>`Für b): Rechnet ${p.N}-mal ${p.S} cm und schreibt das Ergebnis in m und cm.`],
  sol:p=>`a) ${p.h} Stunden · b) ${Math.floor(p.c/100)} m ${p.c%100} cm`},
 {k:'STATION 6',t:'Die Lichtung mit der Wanderkarte',img:'lw-blumen',
  story:()=>`Auf der Lichtung hängt eine Wanderkarte. Drei Wege führen zum Ausgang des Zauberwaldes. Die Eule will den <b>kürzesten</b> Weg nehmen – helft ihr!`,
  tips:['Addiert für jeden Weg alle Teilstrecken.','Vergleicht die drei Summen. 1 km = 1000 m.','Für c): längster Weg minus kürzester Weg.'],
  sol:p=>`A = ${p.T[0]} m, B = ${p.T[1]} m, C = ${p.T[2]} m · kürzester: ${p.best} (${p.mn} m) · Unterschied ${p.diff} m`}
];
let cur=-1, tipN=0, owlTaps=0, owlT=0;

function header(){ return `<div style="display:flex;align-items:center;gap:14px;margin:4px 0 14px"><img src="${IMG['lw-figur']}" style="height:64px"><div><h1>Gefangen im Zauberwald</h1><div class="small" style="font-weight:700">MATHE-ESCAPE-ROOM FÜR ZWEI · LÄNGEN</div></div></div>`; }

/* ---------- Startseite ---------- */
function showStart(){ const s=load();
  $('#app').innerHTML=header()+`<div class="card">
   <div class="owl"><div class="o">🦉</div><div class="bub">Hallo, ihr zwei! Ich bin <b>Eule Ella</b>. Ihr wandert durch den Zauberwald – doch plötzlich zieht Nebel auf. Der <b>Waldgeist</b> hat alle Wege verzaubert! Nur echte <b>Mess-Profis</b> finden wieder hinaus.<br><br>
   An <b>6 Stationen</b> wartet je ein Rätsel. Wer es löst, bekommt eine <b>Zauberzahl</b>. Am Ausgang braucht ihr <b>alle 6 Zauberzahlen</b>!</div></div>
   <div class="bub" style="margin:6px 0 16px;background:#E8F5E9;border-color:#A5D6A7">✏️ <b style="color:#2E5E2A">Ihr braucht:</b> einen Zettel und einen Stift. Schreibt darauf: <b style="color:#2E5E2A">Zauberzahlen: 1 __ 2 __ 3 __ 4 __ 5 __ 6 __</b><br>👥 Ihr spielt <b style="color:#2E5E2A">zu zweit</b>: An jeder Station gibt es einen Rätsel-Chef und einen Schreib-Chef. Danach wird getauscht.</div>
   <div class="grid2"><div><div class="small" style="font-weight:700;margin-bottom:4px">Forscher 1</div><input class="name" id="n1" placeholder="Name" maxlength="16"></div>

  for(let m=0;m<=100;m++){ const x=30+m*K, h=m%10===0?34:m%5===0?24:14; r+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#5a4500" stroke-width="${m%10===0?2.4:1.4}"/>`;
    if(m%10===0) r+=`<text x="${x}" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="#5a4500">${m/10}</text>`; }
  r+=`<text x="830" y="78" font-size="15" font-weight="700" fill="#9a7a10" text-anchor="end">cm</text></g>`;
  s+=r+`</svg><div class="small" style="margin:6px 4px">👆 Das Lineal könnt ihr mit dem Finger verschieben.</div>
   <div class="q"><span class="n">?</span> Weg A: <input class="num" id="a0" inputmode="numeric"> mm &nbsp; Weg B: <input class="num" id="a1" inputmode="numeric"> mm &nbsp; Weg C: <input class="num" id="a2" inputmode="numeric"> mm</div>`;
  $('#pz').innerHTML=s;
  const svg=$('#msv'), g=$('#ruler'); let pos={x:60,y:350}, st=null;
  const pt=e=>{const P=svg.createSVGPoint();P.x=e.clientX;P.y=e.clientY;return P.matrixTransform(svg.getScreenCTM().inverse());};
  g.addEventListener('pointerdown',e=>{st={p:pt(e),o:{...pos}};g.setPointerCapture(e.pointerId);g.style.cursor='grabbing';});
  g.addEventListener('pointermove',e=>{if(!st)return;const q=pt(e);pos.x=Math.max(-700,Math.min(940,st.o.x+q.x-st.p.x));pos.y=Math.max(-40,Math.min(430,st.o.y+q.y-st.p.y));g.setAttribute('transform',`translate(${pos.x} ${pos.y})`);});
  const end=()=>{st=null;g.style.cursor='grab';}; g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
  $('#chk').onclick=()=>{ const v=[0,1,2].map(k=>num($('#a'+k).value));
    if(v.some(isNaN)) return fb('Tragt für alle drei Wege eine Länge in mm ein.');

    const k=wrong[0], w=v[k], L=p.L[k];

    if(Math.abs(w-L)<=3) return fb(`Weg ${'ABC'[k]} ist fast richtig! Schaut noch einmal ganz genau auf die kleinen Millimeter-Striche.`);
    if(Math.abs(w-L)%10===0) return fb(`Bei Weg ${'ABC'[k]} stimmen die Millimeter, aber nicht die ganzen Zentimeter. Liegt die 0 genau am Anfang?`);

};

function showGate(){ cur=-1;
  $('#app').innerHTML=`<div class="card"><div class="sthead"><img src="${IMG['lw-ziel']}"><div><div class="k">DER AUSGANG</div><h2>Das Zaubertor</h2></div></div>
   <div class="owl"><div class="o">🦉</div><div class="bub">Hier ist das Tor aus dem Zauberwald! Es hat ein <b>Zauberschloss</b> mit 6 Feldern. Gebt eure Zauberzahlen von <b>Station 1 bis 6</b> der Reihe nach ein.</div></div>
   <div class="q" style="justify-content:center;gap:12px">${[0,1,2,3,4,5].map(k=>`<div style="text-align:center"><div class="small" style="font-weight:800">${k+1}</div><input class="num s" id="z${k}" maxlength="1" inputmode="numeric" style="width:64px;font-size:34px"></div>`).join('')}</div>
   <div class="fb" id="fb"></div>
   <div class="bar"><button class="btn sec" id="back">🗺️ Karte</button><button class="btn big" id="open">Tor öffnen 🔓</button></div></div>`;
  for(let k=0;k<6;k++){ const e=$('#z'+k); e.oninput=()=>{ e.value=e.value.replace(/\D/g,'').slice(-1); if(e.value&&k<5) $('#z'+(k+1)).focus(); }; }
  $('#back').onclick=showMap;
  $('#open').onclick=()=>{ const v=[0,1,2,3,4,5].map(k=>num($('#z'+k).value)); if(v.some(isNaN)) return fb('Füllt alle 6 Felder aus.');
    const r=v.filter((x,k)=>x===G.zz[k]).length; if(r===6){ G.won=true; G.t1=Date.now(); save(); return showWin(); }
    fb(`Das Tor bleibt zu! 🔒 <b>${r} von 6</b> Zauberzahlen stehen richtig. Prüft euren Zettel. Wenn ihr eine Zahl vergessen habt, könnt ihr die Station auf der Karte noch einmal lösen.`); };
}
function showWin(){ const min=Math.max(1,Math.round(((G.t1||Date.now())-G.t0)/60000));
  $('#app').innerHTML=header()+`<div class="card cert" style="text-align:center"><div style="font-size:64px">🏆</div>
   <div class="small" style="font-weight:800;letter-spacing:.12em;color:#9a6b00">URKUNDE</div><h2 style="font-size:36px;font-weight:800;color:#2E5E2A;margin:6px 0">Ihr seid aus dem Zauberwald entkommen!</h2>
   <p style="font-size:30px;font-weight:800;color:#1565C0;margin:10px 0">${esc(G.names[0])} &amp; ${esc(G.names[1])}</p>
   <p style="font-size:20px">sind echte <b>Mess-Profis</b>. Eule Ella sagt DANKE! 🦉</p>
   <p class="small" style="margin-top:10px">Zeit: ${min} Minuten · Tipps benutzt: ${G.tips}</p>
   <p style="font-size:21px;font-weight:800;margin-top:18px;background:#fff;border-radius:16px;padding:12px">👍 Zeigt diese Urkunde Herrn Kirchinger!</p>
   <button class="btn sec" style="margin-top:16px;font-size:15px" id="again">Neues Spiel</button></div>`;
  $('#again').onclick=()=>{ if(confirmBox()){ try{localStorage.removeItem(KEY);}catch(e){} showStart(); } };
}
window.__zw={get G(){return G;},showStation,showMap,showGate};
showStart();
</script></body></html>
