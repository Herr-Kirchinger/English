<title>English games</title>
<style>
:root{--lila:#6A1B9A;--lila2:#8E24AA;--soft:#EDE7F6;--paper:#F7F2FC;--dot:#E4D8F3;--ink:#2B2140;--muted:#7D6F92}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;
 font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);padding:24px 16px}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.e{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--lila),var(--lila2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:28px;box-shadow:0 4px 0 #4c1270}
h1{margin:0;color:var(--lila);font-size:clamp(26px,5vw,38px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
a.card{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;background:#fff;border-radius:24px;padding:26px 16px;box-shadow:0 6px 0 var(--dot);color:var(--lila);font-weight:700;font-size:26px}
a.card span{font-size:15px;font-weight:400;color:var(--muted)}
a.card .big{font-size:54px;line-height:1}
</style></head><body><div class="wrap">
<header><div class="e">E</div><h1>English games</h1></header>

</div></div></body></html>
