<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Colour Talk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#fffdf7;background-image:radial-gradient(40vh 30vh at 6% 12%,rgba(229,57,53,.10),transparent 70%),radial-gradient(44vh 34vh at 94% 10%,rgba(30,136,229,.10),transparent 70%),radial-gradient(46vh 34vh at 8% 92%,rgba(253,216,53,.16),transparent 70%),radial-gradient(44vh 34vh at 92% 90%,rgba(67,160,71,.11),transparent 70%);color:#2b2140;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(90deg,#E53935,#FB8C00,#FDD835,#43A047,#1E88E5,#8E24AA) bottom/100% 5px no-repeat}
.e{width:42px;height:42px;border-radius:10px;background:#6A1B9A;color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center}
h1{font-size:24px;color:#6A1B9A;font-weight:900}.sub{font-size:13px;color:#a37bbf;font-weight:700}.sp{flex:1}
.score{display:flex;gap:10px}.pl{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.08);border:3px solid transparent}
.pl.on{border-color:#FB8C00}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
.screen{display:none;width:100%;max-width:980px;flex-direction:column;align-items:center;gap:18px;text-align:center}.screen.show{display:flex}
.big{font-size:56px;font-weight:900;background:linear-gradient(90deg,#E53935,#FB8C00,#43A047,#1E88E5,#8E24AA);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.lead{font-size:22px;color:#6d6377;font-weight:700;max-width:760px}
.btn{font:inherit;font-size:24px;font-weight:900;border:none;border-radius:18px;padding:16px 30px;cursor:pointer;background:#6A1B9A;color:#fff;box-shadow:0 5px 0 #4A148C}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4A148C}
.btn.light{background:#fff;color:#6A1B9A;box-shadow:0 4px 0 #e3d4f2}
.kids{display:flex;gap:28px;justify-content:center}.kid{background:#fff;border-radius:22px;padding:16px 26px;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:20px;font-weight:800}.kid .av{font-size:70px}
.toggle{display:flex;align-items:center;gap:10px;font-size:17px;color:#6d6377;font-weight:700;background:#fff;border-radius:999px;padding:8px 16px}
.game{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center;width:100%}
.splash{width:100%;max-height:52vh;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.18))}
.splash.hid{filter:brightness(0) opacity(.12) drop-shadow(0 16px 22px rgba(0,0,0,.18))}
.turn{display:flex;align-items:center;gap:12px;justify-content:center;font-size:26px;font-weight:900;color:#FB8C00}
.turn .av{font-size:54px}
.bub{font-size:40px;font-weight:900;background:#fff;color:#6A1B9A;padding:18px 28px;border-radius:30px;box-shadow:0 10px 24px rgba(106,27,154,.15);position:relative}
.bub.ans{color:#2E7D32}.bub small{display:block;font-size:17px;color:#a99bb8;font-weight:700;margin-top:4px}
.mic{width:120px;height:120px;border-radius:50%;border:none;font-size:56px;cursor:pointer;background:#E53935;color:#fff;box-shadow:0 8px 0 #9E1F1C;position:relative}
.mic.rec{animation:pulse 1s infinite;background:#C62828}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.6),0 8px 0 #9E1F1C}100%{box-shadow:0 0 0 34px rgba(229,57,53,0),0 8px 0 #9E1F1C}}
.heard{min-height:30px;font-size:20px;color:#8a7f95;font-weight:700}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center}
.fb{font-size:30px;font-weight:900;min-height:40px}.fb.ok{color:#2E7D32}.fb.no{color:#E53935}
.judge{display:none;gap:14px}.judge.show{display:flex}
.judge button{font:inherit;font-size:44px;border:none;border-radius:18px;width:110px;height:84px;background:#fff;box-shadow:0 4px 0 #e3d4f2;cursor:pointer}
.say{font:inherit;font-size:17px;font-weight:800;border:none;border-radius:999px;padding:8px 14px;background:#EDE7F6;color:#6A1B9A;cursor:pointer}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:#e3d4f2}.dots i.d{background:#43A047}.dots i.c{background:#FB8C00;transform:scale(1.3)}
.stars{font-size:46px;letter-spacing:6px}
@media (max-width:760px){.game{grid-template-columns:1fr}.big{font-size:40px}.bub{font-size:30px}.splash{max-height:32vh}}
</style></head><body>
<div class="top"><div class="e">E</div><div><h1>Colour Talk</h1><div class="sub">English time · Class 3 · play with a partner</div></div><span class="sp"></span>
<div class="score"><div class="pl" id="p1">🧒 <span id="s1">0</span></div><div class="pl" id="p2">👧 <span id="s2">0</span></div></div></div>
<div class="main">
 <div class="screen show" id="start">
  <div class="big">Colour Talk</div>
  <div class="kids"><div class="kid"><div class="av">🧒</div>Player 1</div><div class="kid"><div class="av">👧</div>Player 2</div></div>
  <div class="lead">One player asks: <b style="color:#6A1B9A">“What colour is it?”</b><br>The other player answers: <b style="color:#2E7D32">“It’s … .”</b><br>Then you swap!</div>
  <label class="toggle" id="microw"><input type="checkbox" id="usemic" checked style="width:22px;height:22px"> 🎤 Speech check (microphone)</label>
  <button class="btn" onclick="startGame()">▶ Start</button>
 </div>
 <div class="screen" id="game">
  <div class="dots" id="dots"></div>
  <div class="game">
   <div><img class="splash" id="pic" alt=""></div>
   <div style="display:flex;flex-direction:column;gap:16px;align-items:center">
    <div class="turn" id="turn"></div>
    <div class="bub" id="bub"></div>
    <div class="row"><button class="mic" id="mic" onclick="listen()">🎤</button><button class="say" id="say" onclick="model()">🔊 Listen</button></div>
    <div class="heard" id="heard"></div>
    <div class="fb" id="fb"></div>
    <div class="judge" id="judge"><button onclick="judge(true)">👍</button><button onclick="judge(false)">👎</button></div>
   </div>
  </div>
 </div>
 <div class="screen" id="end">
  <div class="big">Great teamwork!</div>
  <div class="stars">⭐⭐⭐</div>
  <div class="kids"><div class="kid"><div class="av">🧒</div><span id="e1"></span> stars</div><div class="kid"><div class="av">👧</div><span id="e2"></span> stars</div></div>
  <button class="btn" onclick="startGame()">↻ Play again</button>
 </div>
</div>

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function initAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();Object.keys(AUDIO).forEach(function(k){var b=atob(AUDIO[k].split(",")[1]);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);ac.decodeAudioData(u.buffer,function(x){BUF[k]=x;},function(){});});}if(ac.state==="suspended")ac.resume();}catch(e){}}
function playWord(k,delay){try{if(!BUF[k])return;var s=ac.createBufferSource();s.buffer=BUF[k];s.connect(ac.destination);s.start(ac.currentTime+(delay||0));}catch(e){}}
function speak(t,cb){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";var v=speechSynthesis.getVoices().filter(function(x){return /en-GB/i.test(x.lang)})[0];if(v)u.voice=v;u.rate=0.85;if(cb)u.onend=cb;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){if(cb)cb();}}
function model(){initAudio();var k=order[r];if(phase==="ask")speak("What colour is it?");else{speak("It's",function(){playWord(k,0.05);});setTimeout(function(){playWord(k)},900);}}
function startGame(){initAudio();useMic=$("usemic").checked&&!!SR;order=shuffle(COLS.slice()).slice(0,ROUNDS);r=0;asker=1;score={1:0,2:0};upd();show("game");ask();}
function show(id){["start","game","end"].forEach(function(s){$(s).classList.toggle("show",s===id)});}
function upd(){$("s1").textContent=score[1];$("s2").textContent=score[2];
 $("dots").innerHTML=order.map(function(_,i){return '<i class="'+(i<r?"d":(i===r?"c":""))+'"></i>'}).join("");}
function who(p){return p===1?"🧒":"👧";}
function setTurn(p,txt){$("turn").innerHTML='<span class="av">'+who(p)+'</span>'+txt;$("p1").classList.toggle("on",p===1);$("p2").classList.toggle("on",p===2);}
function ask(){phase="ask";var k=order[r];$("pic").src=IMG[k];$("pic").classList.remove("hid");
 setTurn(asker,"Ask your partner!");$("bub").className="bub";$("bub").innerHTML="What colour is it?<small>Say it into the microphone.</small>";
 $("heard").textContent="";$("fb").textContent="";$("fb").className="fb";prep();}
function answer(){phase="answer";var o=asker===1?2:1;setTurn(o,"Answer!");$("bub").className="bub ans";$("bub").innerHTML="It’s … .<small>Say the colour in a sentence.</small>";$("heard").textContent="";$("fb").textContent="";prep();}
function prep(){if(useMic){$("mic").style.display="";$("judge").classList.remove("show");}else{$("mic").style.display="none";$("judge").classList.add("show");$("heard").textContent=phase==="ask"?"Ask – then your partner shows 👍.":"Answer – then your partner shows 👍 or 👎.";}}
function norm(t){return (" "+t.toLowerCase().replace(/[^a-z' ]/g," ").replace(/\s+/g," ")+" ");}
function check(alts){var k=order[r];
 if(phase==="ask"){return alts.some(function(t){t=norm(t);return /what/.test(t)&&/(colou?r|culler|caller|color|collar)/.test(t)||/what colou?r/.test(t);});}
 return alts.some(function(t){t=norm(t);return SOUND[k].some(function(w){return t.indexOf(" "+w+" ")>=0;});});}
function wrongColour(alts){var k=order[r];for(var c of COLS){if(c===k)continue;if(alts.some(function(t){t=norm(t);return t.indexOf(" "+c+" ")>=0}))return c;}return null;}
function listen(){if(busy||!SR)return;initAudio();busy=true;var m=$("mic");m.classList.add("rec");$("heard").textContent="🎧 Listening …";$("fb").textContent="";
 try{rec=new SR();}catch(e){fallback();return;}
 rec.lang="en-GB";rec.interimResults=false;rec.maxAlternatives=5;var got=false;
 rec.onresult=function(ev){got=true;var alts=[];for(var i=0;i<ev.results[0].length;i++)alts.push(ev.results[0][i].transcript);$("heard").textContent="I heard: “"+alts[0]+"”";result(check(alts),alts);};
 rec.onerror=function(ev){if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){fallback();}else{$("heard").textContent="I didn’t hear you. Tap 🎤 and try again.";}};
 rec.onend=function(){busy=false;m.classList.remove("rec");if(!got&&$("heard").textContent==="🎧 Listening …")$("heard").textContent="I didn’t hear you. Tap 🎤 and try again.";};
 try{rec.start();}catch(e){fallback();}}
function fallback(){busy=false;$("mic").classList.remove("rec");useMic=false;prep();}
function result(ok,alts){var fb=$("fb");
 if(ok){fb.className="fb ok";if(phase==="ask"){fb.textContent="✓ Great question!";setTimeout(answer,1100);}
  else{var k=order[r],o=asker===1?2:1;score[o]++;score[asker]++;fb.innerHTML='✓ Yes! It’s <span style="color:'+HEX[k]+'">'+k+'</span>! ⭐';$("bub").innerHTML='It’s <span style="color:'+HEX[k]+'">'+k+'</span>.';playWord(k,0.2);setTimeout(next,1900);}}
 else{fb.className="fb no";if(phase==="ask")fb.textContent="Try again: “What colour is it?” 🔊";else{var w=alts?wrongColour(alts):null;fb.textContent=w?"Hmm – not "+w+". Look again! 👀":"Try again: “It’s … .” 🔊";}}}
function judge(ok){if(ok)result(true);else{$("fb").className="fb no";$("fb").textContent="Try again! 🔊";}}
function next(){r++;asker=asker===1?2:1;upd();if(r>=order.length){$("e1").textContent=score[1];$("e2").textContent=score[2];show("end");$("p1").classList.remove("on");$("p2").classList.remove("on");}else ask();}
if(!SR){$("usemic").checked=false;$("usemic").disabled=true;$("microw").innerHTML+=' <span style="color:#E53935">(not available on this device – play with 👍 / 👎)</span>';}
</script></body></html>
